[loggers]
keys=root,netscan

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=detailed

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_netscan]
level=INFO
handlers=consoleHandler,fileHandler
qualname=netscan
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=detailed
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=detailed
args=('netscan.log', 'a', 'utf-8')

[formatter_detailed]
format=%(asctime)s | %(levelname)-8s | %(name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S
