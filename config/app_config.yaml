app:
  name: "netscan"
  window_seconds: 3
  slide_seconds: 1
  mode: "monitor"   # monitor | enforce
  default_interface: "eth0"

db:
  url: "sqlite:///./netscan.db"

detection:
  rule_weight: 0.70        # was 0.65 — rules are now more precise, trust them more
  ml_weight: 0.30          # was 0.35
  block_threshold: 0.75    # was 0.85 — block sooner
  alert_threshold: 0.40    # was 0.50 — alert sooner
  ai_review_low: 0.40      # widen the AI review band
  ai_review_high: 0.74     # just below block threshold


ml:
  model_path: "./models/isolation_forest.pkl"
  enabled: true

gemini:
  enabled: false
  api_key_env: "GEMINI_API_KEY"
  base_url: "https://generativelanguage.googleapis.com"
  api_version: "v1beta"
  model: "gemini-2.0-flash"
  timeout_seconds: 15

alerting:
  console: true
  store_in_db: true
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    sender: ""
    password_env: "NETSCAN_EMAIL_PASSWORD"
    recipients: []
  telegram:
    enabled: false
    bot_token_env: "NETSCAN_TELEGRAM_TOKEN"
    chat_id: ""
