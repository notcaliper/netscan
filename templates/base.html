<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetScan NIDS{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/style.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-lock"></i> NetScan NIDS
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">
                    <span id="navLiveDot"
                        style="width:8px;height:8px;border-radius:50%;background:#8b949e;display:inline-block;margin-right:4px;vertical-align:middle"></span>
                    Live Monitor
                </a>
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/devices">Devices</a>
                <a class="nav-link d-flex align-items-center gap-1" href="/blocked" id="navBlocked">
                    <i class="bi bi-shield-x"></i> Blocked IPs
                    <span id="navBlockBadge" class="badge bg-danger ms-1" style="display:none;font-size:.65rem">0</span>
                </a>
                <a class="nav-link" href="/alerts">Alerts API</a>
                <a class="nav-link" href="/health">Health</a>
            </div>

        </div>
    </nav>

    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center text-secondary mt-5 mb-3">
        <small>NetScan &mdash; Metadata-only Network Intrusion Detection System &mdash; No payloads stored.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
    // Poll active blocked IP count and show badge in nav
    function refreshBlockBadge() {
        fetch('/api/blocked')
            .then(r => r.json())
            .then(data => {
                const active = data.filter(b => b.status === 'blocked').length;
                const badge = document.getElementById('navBlockBadge');
                if (badge) {
                    badge.textContent = active;
                    badge.style.display = active > 0 ? 'inline-block' : 'none';
                }
            })
            .catch(() => {});
    }
    refreshBlockBadge();
    setInterval(refreshBlockBadge, 15000);
    </script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
